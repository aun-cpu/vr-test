<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: 人型モデル追加テスト</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* ★ 画面左側のゲージUI設定 */
    #gauge-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      width: 180px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      font-family: sans-serif;
      user-select: none;
      pointer-events: none; /* タップイベントを透過してA-Frameに届かせる */
    }
    #gauge-title {
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    #gauge-bar-bg {
      width: 100%;
      height: 16px;
      background-color: #444;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #666;
    }
    #gauge-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      transition: width 0.3s ease;
    }
    #gauge-text {
      font-size: 12px;
      text-align: right;
      margin-top: 4px;
      color: #ddd;
    }
  </style>

  <script>
    AFRAME.registerComponent('fix-material', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              const mat = node.material;
              mat.side = THREE.DoubleSide;

              if (mat.transparent) {
                mat.alphaTest = 0.5;
                mat.transparent = false;
                mat.depthWrite = true;
              }

              mat.needsUpdate = true;
            }
          });
          console.log("マテリアルの両面描画と透過バグを修正しました！");
        });
      }
    });

    AFRAME.registerComponent('tap-to-action', {
      schema: {
        morphNames: { type: 'array', default: ['まばたき', 'え'] },
        disabledBones: { type: 'array', default: ['両目', '頭'] }
      },

      init: function () {
        const el = this.el;
        let mixer = null;
        let actions = {};
        let activeAction = null;
        let isActionPlaying = false;
        let hasQueuedAction = false;
        let morphTargets = [];
        let otherMorphTargets = [];
        let idleMorphTimer = null;

        // ★ タップ間隔判定用の変数
        let lastTapTime = 0;
        let isFastTap = false;

        // ★ カウント・ゲージ管理用の変数
        let actionCount = 0;
        const maxCount = 500;
        const fillEl = document.getElementById('gauge-bar-fill');
        const textEl = document.getElementById('gauge-text');

        // UIを更新する関数
        const updateGauge = () => {
          if (fillEl && textEl) {
            const percentage = Math.min((actionCount / maxCount) * 100, 100);
            fillEl.style.width = percentage + '%';
            textEl.textContent = `${actionCount} / ${maxCount}`;
          }
        };

        // 頭ボーン制御用
        let headBone = null;
        let headTimer = null;
        let isHeadRotating = false;
        let headRotStartTime = 0;
        let headStartQuat = new THREE.Quaternion();
        let headTargetQuat = new THREE.Quaternion();
        let headBaseQuat = new THREE.Quaternion();

        // 両目ボーン制御用の変数
        let eyesBone = null;
        let isEyesRotating = false;
        let eyesRotStartTime = 0;
        let eyesRotDuration = 300;
        let eyesStartQuat = new THREE.Quaternion();
        let eyesTargetQuat = new THREE.Quaternion();
        let eyesBaseQuat = new THREE.Quaternion();

        const animateMorphsTarget = (targets, fromVal, toVal, duration, callback) => {
          if (targets.length === 0) {
            if (callback) callback();
            return;
          }

          const startTime = performance.now();
          const step = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const currentVal = fromVal + (toVal - fromVal) * progress;

            targets.forEach((target) => {
              target.mesh.morphTargetInfluences[target.index] = currentVal;
            });

            if (progress < 1) {
              requestAnimationFrame(step);
            } else if (callback) {
              callback();
            }
          };
          requestAnimationFrame(step);
        };

        const animateMorphs = (fromVal, toVal, duration, callback) => {
          animateMorphsTarget(morphTargets, fromVal, toVal, duration, callback);
        };

        const rotateEyesTo = (targetQuat, duration = 300, callback = null) => {
          if (!eyesBone) {
            if (callback) callback();
            return;
          }
          eyesStartQuat.copy(eyesBone.quaternion);
          eyesTargetQuat.copy(targetQuat);
          eyesRotDuration = duration;
          eyesRotStartTime = performance.now();
          isEyesRotating = true;

          setTimeout(() => {
            if (callback) callback();
          }, duration);
        };

        const getEyesLookAtCameraQuat = (angleDeg = 30) => {
          if (!eyesBone) return eyesBaseQuat;

          const camera = el.sceneEl.camera;
          if (!camera) return eyesBaseQuat;

          const cameraWorldPos = new THREE.Vector3();
          camera.getWorldPosition(cameraWorldPos);

          const eyesWorldPos = new THREE.Vector3();
          eyesBone.getWorldPosition(eyesWorldPos);

          const parentWorldQuat = new THREE.Quaternion();
          if (eyesBone.parent) {
            eyesBone.parent.getWorldQuaternion(parentWorldQuat);
          }

          const dirToCamera = new THREE.Vector3().subVectors(cameraWorldPos, eyesWorldPos).normalize();
          const localDir = dirToCamera.clone().applyQuaternion(parentWorldQuat.clone().invert());
          const fullLookAtQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), localDir);

          const angleRad = THREE.MathUtils.degToRad(angleDeg);
          const fullAngle = eyesBaseQuat.angleTo(fullLookAtQuat);
          const factor = fullAngle > 0 ? Math.min(angleRad / fullAngle, 1.0) : 0;

          return eyesBaseQuat.clone().slerp(fullLookAtQuat, factor);
        };

        const repeatMorphs = (count, maxMorphCount, onComplete) => {
          if (count >= maxMorphCount || isActionPlaying) {
            if (onComplete) onComplete();
            return;
          }
          animateMorphsTarget(otherMorphTargets, 0, 0.4, 150, () => {
            animateMorphsTarget(otherMorphTargets, 0.4, 0, 150, () => {
              repeatMorphs(count + 1, maxMorphCount, onComplete);
            });
          });
        };

        const scheduleNextIdleMorph = () => {
          clearTimeout(idleMorphTimer);
          const randomDelay = 10000 + Math.random() * 10000;

          idleMorphTimer = setTimeout(() => {
            if (!isActionPlaying) {
              const targetQuat = getEyesLookAtCameraQuat(30);
              rotateEyesTo(targetQuat, 300, () => {
                repeatMorphs(0, 5, () => {
                  rotateEyesTo(eyesBaseQuat, 300, () => {
                    scheduleNextIdleMorph();
                  });
                });
              });
            } else {
              scheduleNextIdleMorph();
            }
          }, randomDelay);
        };

        const scheduleNextHeadRotation = () => {
          clearTimeout(headTimer);
          if (!headBone) return;

          const randomDelay = 5000 + Math.random() * 5000;

          headTimer = setTimeout(() => {
            if (headBone) {
              const pitchDeg = 5 + Math.random() * 10;
              const yawDeg = (Math.random() - 0.5) * 40;
              const rollDeg = (Math.random() - 0.5) * 30;

              const pitch = THREE.MathUtils.degToRad(pitchDeg);
              const yaw = THREE.MathUtils.degToRad(yawDeg);
              const roll = THREE.MathUtils.degToRad(rollDeg);

              const offsetEuler = new THREE.Euler(pitch, yaw, roll, 'YXZ');
              const offsetQuat = new THREE.Quaternion().setFromEuler(offsetEuler);

              headStartQuat.copy(headBone.quaternion);
              headTargetQuat.copy(headBaseQuat).multiply(offsetQuat);

              headRotStartTime = performance.now();
              isHeadRotating = true;

              setTimeout(() => {
                scheduleNextHeadRotation();
              }, 1000 + 100);
            }
          }, randomDelay);
        };

        // action 再生処理を一括管理する関数
        const playActionProcess = () => {
          console.log("action を再生");
          clearTimeout(idleMorphTimer);

          if (actionCount < maxCount) {
            actionCount++;
            updateGauge();
          }

          if (eyesBone) rotateEyesTo(eyesBaseQuat, 200);

          el.removeAttribute('animation__move');
          el.setAttribute('position', '0 0.02 -0.5');

          actions['idle'].stop();

          // ★ 直前のタップ間隔が0.5秒以下だった場合は再生スピードを1.3倍に設定
          const actionClip = actions['action'];
          actionClip.timeScale = isFastTap ? 1.3 : 1.0;

          actionClip.reset();
          actionClip.play();
          activeAction = actionClip;

          const targetIntensity = Math.random() < 0.5 ? 0.5 : 0.3;

          animateMorphs(0, targetIntensity, 300, () => {
            animateMorphs(targetIntensity, 0, 200);
          });
        };

        // モデルロード完了処理
        el.addEventListener('model-loaded', () => {
          const model = el.getObject3D('mesh');
          if (!model || !model.animations || model.animations.length === 0) return;

          const disabledBones = this.data.disabledBones.map(b => b.trim());
          model.animations.forEach((clip) => {
            clip.tracks = clip.tracks.filter((track) => {
              const isMatch = disabledBones.some(boneName => track.name.includes(boneName));
              return !isMatch;
            });
          });

          model.traverse((node) => {
            if (node.isBone) {
              if (node.name === '頭') {
                headBone = node;
                headBaseQuat.copy(node.quaternion);
                scheduleNextHeadRotation();
              }
              if (node.name === '両目') {
                eyesBone = node;
                eyesBaseQuat.copy(node.quaternion);
              }
            }
          });

          mixer = new THREE.AnimationMixer(model);

          model.animations.forEach((clip) => {
            actions[clip.name] = mixer.clipAction(clip);
          });

          if (actions['idle']) {
            activeAction = actions['idle'];
            activeAction.play();
            scheduleNextIdleMorph();
          }

          if (actions['action']) {
            actions['action'].setLoop(THREE.LoopOnce, 1);
            actions['action'].clampWhenFinished = true;
          }

          morphTargets = [];
          otherMorphTargets = [];
          const targetsToSearch = this.data.morphNames.map(name => name.trim());

          model.traverse((node) => {
            if (node.isMesh && node.morphTargetDictionary && node.morphTargetInfluences) {
              targetsToSearch.forEach((morphName) => {
                const index = node.morphTargetDictionary[morphName];
                if (index !== undefined) {
                  const item = { mesh: node, index: index, name: morphName };
                  morphTargets.push(item);
                  if (morphName !== 'まばたき') {
                    otherMorphTargets.push(item);
                  }
                }
              });
            }
          });

          mixer.addEventListener('finished', (e) => {
            if (e.action === actions['action'] && isActionPlaying) {
              if (hasQueuedAction) {
                hasQueuedAction = false;
                playActionProcess();
              } else {
                isActionPlaying = false;

                el.removeAttribute('animation__move');
                el.setAttribute('animation__move', {
                  property: 'position',
                  to: '0 0 -0.5',
                  dur: 400,
                  easing: 'easeInOutQuad'
                });

                const actionClip = actions['action'];
                const idleClip = actions['idle'];

                // ★ idleに戻るときはスピードを通常(1.0倍)に戻す
                actionClip.timeScale = 1.0;

                idleClip.reset();
                idleClip.play();
                actionClip.crossFadeTo(idleClip, 0.4, true);
                activeAction = idleClip;

                scheduleNextIdleMorph();
              }
            }
          });
        });

        this.tick = function (t, dt) {
          if (mixer) mixer.update(dt / 1000);

          if (isHeadRotating && headBone) {
            const now = performance.now();
            const progress = Math.min((now - headRotStartTime) / 1000, 1);
            headBone.quaternion.slerpQuaternions(headStartQuat, headTargetQuat, progress);
            if (progress >= 1) isHeadRotating = false;
          }

          if (isEyesRotating && eyesBone) {
            const now = performance.now();
            const progress = Math.min((now - eyesRotStartTime) / eyesRotDuration, 1);
            eyesBone.quaternion.slerpQuaternions(eyesStartQuat, eyesTargetQuat, progress);
            if (progress >= 1) isEyesRotating = false;
          }
        };

        window.addEventListener('click', () => {
          const now = performance.now();
          const interval = now - lastTapTime;

          // ★ 直前のタップから 500ms (0.5秒) 以下であれば高速タップと判定
          if (lastTapTime > 0 && interval <= 500) {
            isFastTap = true;
          } else {
            isFastTap = false;
          }
          lastTapTime = now;

          if (actions['action'] && actions['idle']) {
            if (!isActionPlaying) {
              isActionPlaying = true;
              hasQueuedAction = false;
              playActionProcess();
            } else {
              hasQueuedAction = true;
            }
          }
        });
      }
    });
  </script>
</head>
<body>
  <!-- ★ 画面左上に配置するゲージUI -->
  <div id="gauge-container">
    <div id="gauge-title">ACTION COUNT</div>
    <div id="gauge-bar-bg">
      <div id="gauge-bar-fill"></div>
    </div>
    <div id="gauge-text">0 / 500</div>
  </div>

  <a-scene vr-mode-ui="enabled: true">

    <a-entity id="rig" position="0 0.1 -0.4">
      <a-camera look-controls camera="near: 0.01; far: 1000;"></a-camera>
    </a-entity>

    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.5"></a-entity>
    <a-entity light="type: point; color: #FFFFFF; intensity: 0.5; distance: 30" position="0 2 0"></a-entity>

    <a-gltf-model src="bg.glb" position="0 0 -0.3"></a-gltf-model>

    <a-gltf-model 
      id="avatar" 
      src="character_anim.glb?v=2" 
      position="0 0 -0.5" 
      scale="1.1 1.1 1.1" 
      fix-material
      tap-to-action="morphNames: まばたき,え; disabledBones: 両目,頭">
    </a-gltf-model>

    <a-sky color="#000000"></a-sky>

  </a-scene>
</body>
</html>
