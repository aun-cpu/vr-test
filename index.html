<!DOCTYPE html>
<html>
  <head>

    <meta charset="utf-8">
    <title>MMD Loop Animation</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- アニメーション再生用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>

    <a-scene>
      <a-assets>
        <!-- キャッシュ対策で ?v=7 を付与 -->
        <a-asset-item id="character" src="character_anim.glb?v=7"></a-asset-item>
      </a-assets>

      <!-- カメラ設定タグ -->
      <a-entity 
        camera 
        position="0 1.2 0" 
        look-controls="pointerLockEnabled: false">
      </a-entity>

      <!-- Idle アニメーションを無限ループ再生 -->
      <a-entity 
        id="character-model"
        gltf-model="#character" 
        animation-mixer="clip: Idle; loop: repeat"
        position="0 0 -2.5"
        scale="1 1 1">
      </a-entity>

      <!-- 背景・照明設定 -->
      <a-sky color="#ECECEC"></a-sky>
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>
    </a-scene>

  </body>
</html>
