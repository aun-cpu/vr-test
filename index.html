<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMD Direct Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Three.js および MMD関連ライブラリ（CDNから読み込み） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/mmdparser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MMDLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/CCDIKSolver.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/MMDPhysics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/animation/MMDAnimationHelper.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    // --- 基本設定 ---
    const PMX_FILE = 'model.pmx';   // MMDモデルのファイル名
    const VMD_FILE = 'motion.vmd';  // モーションのファイル名

    let scene, camera, renderer, helper, clock;

    // ★【追加1】一部のテクスチャ（Toonやスフィア）が足りなくても無視して読み込む処理
    THREE.DefaultLoadingManager.onError = function (url) {
      console.warn('読み込めなかったファイル（無視して続行します）:', url);
    };

    init();

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      // 1. シーン作成
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      // 2. カメラ設定
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      // ★【追加2】カメラ位置を(0, 10, 30)から(0, 10, 60)へ遠ざけ、全身が映るように変更
      camera.position.set(0, 10, 60);

      // 3. ライト設定（モデルが綺麗に見える照明）
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // 4. レンダラー設定
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // マウス操作（画面をドラッグして360度回転可能）
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 10, 0);
      controls.update();

      // 5. MMDアニメーションヘルパー
      helper = new THREE.MMDAnimationHelper();

      // 6. PMX と VMD を直接読み込む
      const loader = new THREE.MMDLoader();

      loader.loadWithAnimation(
        PMX_FILE,
        VMD_FILE,
        function (mmd) {
          const mesh = mmd.mesh;

          // ★【追加3】テクスチャの透過バグ・黒化を防止する処理
          if (Array.isArray(mesh.material)) {
            mesh.material.forEach(mat => {
              mat.transparent = false;
            });
          }

          scene.add(mesh);

          // アニメーションと物理演算（髪や服の揺れ）を追加
          helper.add(mesh, {
            animation: mmd.animation,
            physics: true
          });

          // 描画ループ開始
          animate();
        },
        function (xhr) {
          // 読み込み進捗の表示
          if (xhr.lengthComputable) {
            const percentComplete = (xhr.loaded / xhr.total) * 100;
            console.log(Math.round(percentComplete, 2) + '% loaded');
          }
        },
        function (error) {
          console.error('読み込みエラー:', error);
        }
      );

      // 画面サイズ変更対応
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      helper.update(delta); // モーションを進める
      renderer.render(scene, camera);
    }
  </script>

</body>
</html>
