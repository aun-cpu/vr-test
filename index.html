<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面サイズに最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1: 背景VR表示テスト</title>
  
  <!-- 1. WebVR用ライブラリ（A-Frame）の読み込み -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <!-- VR空間（シーン）の定義 -->
  <a-scene vr-mode-ui="enabled: true">
    
    <!-- 2. ライト（照明）の設定：空間と背景をきれいに発色させるため -->
    <!-- 全体を平均的に照らす光 -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.7"></a-entity>
    <!-- 斜め上からの光（立体感を出す） -->
    <a-entity light="type: directional; color: #FFFFFF; intensity: 0.5" position="-1 4 2"></a-entity>

    <!-- 3. 背景モデル（bg.glb）の呼び出し -->
    <!-- 位置(position)や向き(rotation)は必要に応じて調整してください -->
    <a-gltf-model src="bg.glb" position="0 0 0" rotation="0 0 0"></a-gltf-model>

    <!-- 4. 空の色（背景モデルの外側の色） -->
    <a-sky color="#87CEEB"></a-sky>

  </a-scene>
</body>
</html>
