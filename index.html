<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1: 背景VR表示テスト</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true">
    
    <!-- ★重要：視点（カメラ）の位置を調整 -->
    <!-- position="0 1.6 2" は「高さ1.6m(目線)、手前2m」の位置に立つのを意味します -->
    <!-- もし画面が真っ暗や空しか見えない場合は z の数字(2) を 0 や -2 に書き換えて部屋の中に移動してください -->
    <a-entity id="rig" position="0 1 0">
      <a-camera look-controls camera="near: 0.1; far: 1000;"></a-camera>
    </a-entity>

    <!-- 全体を平均的に照らす光 -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.0"></a-entity>
    <!-- 部屋の中を照らす光 -->
    <a-entity light="type: point; color: #FFFFFF; intensity: 1.2; distance: 30" position="0 2 0"></a-entity>

    <!-- 背景モデル（bg.glb） -->
    <a-gltf-model src="bg.glb" position="0 0 0"></a-gltf-model>

    <!-- 空の色 -->
    <a-sky color="#87CEEB"></a-sky>

  </a-scene>
</body>
</html>
