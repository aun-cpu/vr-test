<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: 人型モデル追加テスト</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('fix-material', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              const mat = node.material;
              mat.side = THREE.DoubleSide;

              if (mat.transparent) {
                mat.alphaTest = 0.5;
                mat.transparent = false;
                mat.depthWrite = true;
              }

              mat.needsUpdate = true;
            }
          });
          console.log("マテリアルの両面描画と透過バグを修正しました！");
        });
      }
    });

    // ★ 修正版 tap-to-action
    AFRAME.registerComponent('tap-to-action', {
      init: function () {
        const el = this.el;
        let isActionPlaying = false;

        window.addEventListener('click', () => {
          if (!isActionPlaying) {
            isActionPlaying = true;
            console.log("action を再生します");

            // 1. 位置を即座に更新
            el.removeAttribute('animation__move');
            el.setAttribute('position', '0 0.02 -0.5');

            // 2. ミキサーを一旦破棄して再セット（属性変更の無視とミキサー破綻を防ぐ）
            el.removeAttribute('animation-mixer');
            
            // 1フレーム遅らせて確実にコンポーネントを再生成
            setTimeout(() => {
              el.setAttribute('animation-mixer', {
                clip: 'action',
                loop: 'once',
                clampWhenFinished: true,
                crossFadeDuration: 0
              });
            }, 0);
          }
        });

        // モーション再生終了時
        el.addEventListener('animation-finished', (e) => {
          // action 終了時のみ処理（他のアニメーションイベントとの混同を防止）
          if (isActionPlaying) {
            console.log("action 完了: idle に戻します");

            // 1. 位置を元に戻す
            el.setAttribute('animation__move', {
              property: 'position',
              to: '0 0 -0.5',
              dur: 500,
              easing: 'easeInOutQuad'
            });

            // 2. 一度破棄してから idle を再セット
            el.removeAttribute('animation-mixer');
            setTimeout(() => {
              el.setAttribute('animation-mixer', {
                clip: 'idle',
                loop: 'repeat',
                crossFadeDuration: 0.4
              });
              
              // idle 再生が再開されたらフラグを下ろす
              isActionPlaying = false;
            }, 0);
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true">
    
    <a-entity id="rig" position="0 0.1 -0.4">
      <a-camera look-controls camera="near: 0.01; far: 1000;"></a-camera>
    </a-entity>

    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.5"></a-entity>
    <a-entity light="type: point; color: #FFFFFF; intensity: 0.5; distance: 30" position="0 2 0"></a-entity>

    <a-gltf-model src="bg.glb" position="0 0 -0.3"></a-gltf-model>

    <a-gltf-model 
      id="avatar" 
      src="character_anim.glb?v=2" 
      position="0 0 -0.5" 
      scale="1.1 1.1 1.1" 
      fix-material
      tap-to-action
      animation-mixer="clip: idle; loop: repeat">
    </a-gltf-model>

    <a-sky color="#000000"></a-sky>

  </a-scene>
</body>
</html>
