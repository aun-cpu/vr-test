<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: 人型モデル追加テスト</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('fix-material', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              const mat = node.material;
              mat.side = THREE.DoubleSide;

              if (mat.transparent) {
                mat.alphaTest = 0.5;
                mat.transparent = false;
                mat.depthWrite = true;
              }

              mat.needsUpdate = true;
            }
          });
          console.log("マテリアルの両面描画と透過バグを修正しました！");
        });
      }
    });

    // ★ 複数モーフの同時制御 ＋ 変化量ランダム化コンポーネント
    AFRAME.registerComponent('tap-to-action', {
      schema: {
        morphNames: { type: 'array', default: ['Blink'] }
      },

      init: function () {
        const el = this.el;
        let mixer = null;
        let actions = {};
        let activeAction = null;
        let isActionPlaying = false;
        let morphTargets = [];

        // 全モーフターゲットの値をアニメーション変化させる関数
        const animateMorphs = (fromVal, toVal, duration, callback) => {
          if (morphTargets.length === 0) {
            if (callback) callback();
            return;
          }

          const startTime = performance.now();
          const step = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const currentVal = fromVal + (toVal - fromVal) * progress;

            morphTargets.forEach((target) => {
              target.mesh.morphTargetInfluences[target.index] = currentVal;
            });

            if (progress < 1) {
              requestAnimationFrame(step);
            } else if (callback) {
              callback();
            }
          };
          requestAnimationFrame(step);
        };

        // モデルロード完了処理
        el.addEventListener('model-loaded', () => {
          const model = el.getObject3D('mesh');
          if (!model || !model.animations || model.animations.length === 0) return;

          mixer = new THREE.AnimationMixer(model);

          model.animations.forEach((clip) => {
            actions[clip.name] = mixer.clipAction(clip);
          });

          if (actions['idle']) {
            activeAction = actions['idle'];
            activeAction.play();
          }

          if (actions['action']) {
            actions['action'].setLoop(THREE.LoopOnce, 1);
            actions['action'].clampWhenFinished = true;
          }

          // 対象モーフの検出
          morphTargets = [];
          const targetsToSearch = this.data.morphNames.map(name => name.trim());

          model.traverse((node) => {
            if (node.isMesh && node.morphTargetDictionary && node.morphTargetInfluences) {
              targetsToSearch.forEach((morphName) => {
                const index = node.morphTargetDictionary[morphName];
                if (index !== undefined) {
                  morphTargets.push({ mesh: node, index: index, name: morphName });
                }
              });
            }
          });
          console.log(`対象モーフ [${targetsToSearch.join(', ')}] を検出: 計 ${morphTargets.length} 件`);

          // アニメーション終了検知
          mixer.addEventListener('finished', (e) => {
            if (e.action === actions['action'] && isActionPlaying) {
              isActionPlaying = false;
              console.log("action 終了: 位置とモーションを滑らかに戻します");

              el.removeAttribute('animation__move');
              el.setAttribute('animation__move', {
                property: 'position',
                to: '0 0 -0.5',
                dur: 400,
                easing: 'easeInOutQuad'
              });

              const actionClip = actions['action'];
              const idleClip = actions['idle'];

              idleClip.reset();
              idleClip.play();
              actionClip.crossFadeTo(idleClip, 0.4, true);
              activeAction = idleClip;
            }
          });
        });

        // フレーム更新
        this.tick = function (t, dt) {
          if (mixer) mixer.update(dt / 1000);
        };

        // 画面タップイベント
        window.addEventListener('click', () => {
          if (!isActionPlaying && actions['action'] && actions['idle']) {
            isActionPlaying = true;
            console.log("action を即座に再生");

            el.removeAttribute('animation__move');
            el.setAttribute('position', '0 0.02 -0.5');

            actions['idle'].stop();
            actions['action'].reset();
            actions['action'].play();
            activeAction = actions['action'];

            // ★ 変化量をランダムで 0.5 または 0.3 に決定
            const targetIntensity = Math.random() < 0.5 ? 0.5 : 0.3;
            console.log(`今回のモーフ変化量: ${targetIntensity}`);

            // ★ 0 -> ランダム値 (0.3 or 0.5) へ 0.3秒で変化後、0.2秒で 0 へ復元
            animateMorphs(0, targetIntensity, 300, () => {
              animateMorphs(targetIntensity, 0, 200);
            });
          }
        });
      }
    });
  </script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true">
    
    <a-entity id="rig" position="0 0.1 -0.4">
      <a-camera look-controls camera="near: 0.01; far: 1000;"></a-camera>
    </a-entity>

    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.5"></a-entity>
    <a-entity light="type: point; color: #FFFFFF; intensity: 0.5; distance: 30" position="0 2 0"></a-entity>

    <a-gltf-model src="bg.glb" position="0 0 -0.3"></a-gltf-model>

    <a-gltf-model 
      id="avatar" 
      src="character_anim.glb?v=2" 
      position="0 0 -0.5" 
      scale="1.1 1.1 1.1" 
      fix-material
      tap-to-action="morphNames: まばたき,お">
    </a-gltf-model>

    <a-sky color="#000000"></a-sky>

  </a-scene>
</body>
</html>
