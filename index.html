<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: 人型モデル追加テスト</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* 画面左側の縦型ピンクゲージUI設定 */
    #gauge-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      width: 16px;
      height: 180px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px;
      border-radius: 10px;
      user-select: none;
      pointer-events: none;
    }
    #gauge-bar-bg {
      width: 100%;
      height: 100%;
      background-color: #444;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #666;
      display: flex;
      align-items: flex-end;
    }
    #gauge-bar-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #ff80ab, #e91e63);
      transition: height 0.3s ease;
    }
  </style>

  <script>
    AFRAME.registerComponent('fix-material', {
      schema: {
        wetness: { type: 'number', default: 0.1 },
        metalness: { type: 'number', default: 0.1 }
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              const materials = Array.isArray(node.material) ? node.material : [node.material];

              materials.forEach((mat) => {
                mat.side = THREE.DoubleSide;

                if (mat.transparent) {
                  mat.alphaTest = 0.5;
                  mat.transparent = false;
                  mat.depthWrite = true;
                }

                if ('roughness' in mat) {
                  mat.roughness = this.data.wetness;
                }
                if ('metalness' in mat) {
                  mat.metalness = this.data.metalness;
                }

                mat.needsUpdate = true;
              });
            }
          });
          console.log("マテリアルの濡れ感・修正を適用しました！");
        });
      }
    });

    AFRAME.registerComponent('tap-to-action', {
      schema: {
        morphNames: { type: 'array', default: ['まばたき', 'え'] },
        disabledBones: { type: 'array', default: ['両目', '頭'] }
      },

      init: function () {
        const el = this.el;
        let mixer = null;
        let actions = {};
        let activeAction = null;
        let isActionPlaying = false;
        let hasQueuedAction = false;
        let morphTargets = [];
        let otherMorphTargets = [];
        let idleMorphTimer = null;

        let avatar2El = null;
        let mixer2 = null;
        let actions2 = {};

        let lastTapTime = 0;
        let isFastTap = false;

        let actionCount = 0;
        const maxCount = 300;
        const fillEl = document.getElementById('gauge-bar-fill');

        // Web Audio API & 反響（リバーブ）ノード用の変数
        let audioCtx = null;
        let reverbNode = null;
        let sound4Buffer = null;
        let sound4Source = null;

        // sound5 / sound6 用の変数（音量を大きく設定）
        let sound5Buffer = null;
        let sound6Buffer = null;
        let sound5Source = null;
        let sound5GainNode = null;
        const SOUND5_BASE_VOLUME = 0.8;
        const SOUND5_BOOST_VOLUME = 2.0;

        // sound7 / sound8 / sound9 / sound10 用の変数
        let sound7Buffer = null;
        let sound8Buffer = null;
        let sound9Buffer = null;
        let sound10Buffer = null;

        // 擬似的なリバーブ（反響）効果を作成する関数
        const createReverbNode = (ctx) => {
          const sampleRate = ctx.sampleRate;
          const length = sampleRate * 1.5;
          const impulse = ctx.createBuffer(2, length, sampleRate);
          const left = impulse.getChannelData(0);
          const right = impulse.getChannelData(1);

          for (let i = 0; i < length; i++) {
            const decay = Math.exp(-i / (sampleRate * 0.3));
            left[i] = (Math.random() * 2 - 1) * decay;
            right[i] = (Math.random() * 2 - 1) * decay;
          }

          const convolver = ctx.createConvolver();
          convolver.buffer = impulse;
          return convolver;
        };

        // オーディオコンテキストの初期化処理
        const initAudioContext = () => {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            reverbNode = createReverbNode(audioCtx);
            reverbNode.connect(audioCtx.destination);
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        };

        // 効果音再生用（sound1~3等の単体音声用、デフォルト音量を 4.0 に拡張）
        const playAmplifiedSound = async (soundFile, speed, volumeBoost = 4.0) => {
          try {
            initAudioContext();

            const response = await fetch(soundFile);
            const arrayBuffer = await response.arrayBuffer();
            const buffer = await audioCtx.decodeAudioData(arrayBuffer);

            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();

            source.buffer = buffer;
            source.playbackRate.value = speed;
            gainNode.gain.value = volumeBoost;

            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const reverbGain = audioCtx.createGain();
            reverbGain.gain.value = 0.3;
            gainNode.connect(reverbGain);
            reverbGain.connect(reverbNode);

            source.start(0);
          } catch (err) {
            console.log("音声再生エラー (" + soundFile + "):", err);
          }
        };

        // 事前読み込み済みバッファーを再生する関数（音量デフォルトを sound2 と同じ 4.0 に指定）
        const playBufferSound = (buffer, speed = 1.0, volumeBoost = 4.0) => {
          if (!buffer) return;
          try {
            initAudioContext();

            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();

            source.buffer = buffer;
            source.playbackRate.value = speed;
            gainNode.gain.value = volumeBoost;

            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const reverbGain = audioCtx.createGain();
            reverbGain.gain.value = 0.3;
            gainNode.connect(reverbGain);
            reverbGain.connect(reverbNode);

            source.start(0);
          } catch (err) {
            console.log("バッファー音声再生エラー:", err);
          }
        };

        // アイドル時のランダム音声再生関数（環境音のため音量を控えめの 0.4 に明示指定）
        const playRandomIdleSound = () => {
          const idleBuffers = [sound7Buffer, sound8Buffer, sound9Buffer].filter(b => b !== null);
          if (idleBuffers.length === 0) return;

          const chosenBuffer = idleBuffers[Math.floor(Math.random() * idleBuffers.length)];
          playBufferSound(chosenBuffer, 1.0, 0.4); 
        };

        // 各種音声データの事前読み込み
        const initAudioBuffers = async () => {
          try {
            initAudioContext();

            fetch('sound4.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound4Buffer = decoded; })
              .catch(err => console.log("sound4.mp3 読み込み失敗:", err));

            fetch('sound5.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound5Buffer = decoded; })
              .catch(err => console.log("sound5.mp3 読み込み失敗:", err));

            fetch('sound6.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound6Buffer = decoded; })
              .catch(err => console.log("sound6.mp3 読み込み失敗:", err));

            fetch('sound7.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound7Buffer = decoded; })
              .catch(err => console.log("sound7.mp3 読み込み失敗:", err));

            fetch('sound8.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound8Buffer = decoded; })
              .catch(err => console.log("sound8.mp3 読み込み失敗:", err));

            fetch('sound9.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound9Buffer = decoded; })
              .catch(err => console.log("sound9.mp3 読み込み失敗:", err));

            // sound10.mp3 の事前読み込み
            fetch('sound10.mp3')
              .then(res => res.arrayBuffer())
              .then(buf => audioCtx.decodeAudioData(buf))
              .then(decoded => { sound10Buffer = decoded; })
              .catch(err => console.log("sound10.mp3 読み込み失敗:", err));

          } catch (err) {
            console.log("オーディオ初期化エラー:", err);
          }
        };
        initAudioBuffers();

        // sound4.mp3 ループ再生関数
        const playSound4Loop = () => {
          if (!sound4Buffer) return;
          initAudioContext();

          stopSound4Loop();

          sound4Source = audioCtx.createBufferSource();
          sound4Source.buffer = sound4Buffer;
          sound4Source.loop = true;
          sound4Source.playbackRate.value = 0.9;
          sound4Source.detune.value = 500;

          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 1.0;

          const pannerNode = audioCtx.createPanner();
          pannerNode.panningModel = 'HRTF';
          pannerNode.distanceModel = 'inverse';
          pannerNode.setPosition(0, 0, 0.1);

          sound4Source.connect(gainNode);
          gainNode.connect(pannerNode);
          pannerNode.connect(audioCtx.destination);

          const reverbGain = audioCtx.createGain();
          reverbGain.gain.value = 0.25;
          pannerNode.connect(reverbGain);
          reverbGain.connect(reverbNode);

          sound4Source.start(0);
        };

        const stopSound4Loop = () => {
          if (sound4Source) {
            try {
              sound4Source.stop();
              sound4Source.disconnect();
            } catch (e) {}
            sound4Source = null;
          }
        };

        const startSound5Loop = () => {
          const targetBuffer = (actionCount > maxCount / 2) ? sound6Buffer : sound5Buffer;

          if (!targetBuffer) return;
          initAudioContext();

          if (sound5Source) return;

          sound5Source = audioCtx.createBufferSource();
          sound5Source.buffer = targetBuffer;
          sound5Source.loop = true;

          sound5GainNode = audioCtx.createGain();
          sound5GainNode.gain.value = SOUND5_BASE_VOLUME;

          sound5Source.connect(sound5GainNode);
          sound5GainNode.connect(audioCtx.destination);

          const reverbGain = audioCtx.createGain();
          reverbGain.gain.value = 0.2;
          sound5GainNode.connect(reverbGain);
          reverbGain.connect(reverbNode);

          sound5Source.start(0);
        };

        const stopSound5Loop = () => {
          if (sound5Source) {
            try {
              sound5Source.stop();
              sound5Source.disconnect();
            } catch (e) {}
            sound5Source = null;
            sound5GainNode = null;
          }
        };

        const boostSound5Volume = () => {
          if (!sound5GainNode || !audioCtx) return;

          const now = audioCtx.currentTime;
          sound5GainNode.gain.cancelScheduledValues(now);
          sound5GainNode.gain.setValueAtTime(SOUND5_BOOST_VOLUME, now);
          sound5GainNode.gain.linearRampToValueAtTime(SOUND5_BASE_VOLUME, now + 0.4);
        };

        const updateGauge = () => {
          if (fillEl) {
            const percentage = Math.min((actionCount / maxCount) * 100, 100);
            fillEl.style.height = percentage + '%';
          }
        };

        let headBone = null;
        let headTimer = null;
        let isHeadRotating = false;
        let headRotStartTime = 0;
        let headStartQuat = new THREE.Quaternion();
        let headTargetQuat = new THREE.Quaternion();
        let headBaseQuat = new THREE.Quaternion();

        let eyesBone = null;
        let isEyesRotating = false;
        let eyesRotStartTime = 0;
        let eyesRotDuration = 300;
        let eyesStartQuat = new THREE.Quaternion();
        let eyesTargetQuat = new THREE.Quaternion();
        let eyesBaseQuat = new THREE.Quaternion();

        const animateMorphsTarget = (targets, fromVal, toVal, duration, callback) => {
          if (targets.length === 0) {
            if (callback) callback();
            return;
          }

          const startTime = performance.now();
          const step = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const currentVal = fromVal + (toVal - fromVal) * progress;

            targets.forEach((target) => {
              target.mesh.morphTargetInfluences[target.index] = currentVal;
            });

            if (progress < 1) {
              requestAnimationFrame(step);
            } else if (callback) {
              callback();
            }
          };
          requestAnimationFrame(step);
        };

        const animateMorphs = (fromVal, toVal, duration, callback) => {
          animateMorphsTarget(morphTargets, fromVal, toVal, duration, callback);
        };

        const rotateEyesTo = (targetQuat, duration = 300, callback = null) => {
          if (!eyesBone) {
            if (callback) callback();
            return;
          }
          eyesStartQuat.copy(eyesBone.quaternion);
          eyesTargetQuat.copy(targetQuat);
          eyesRotDuration = duration;
          eyesRotStartTime = performance.now();
          isEyesRotating = true;

          setTimeout(() => {
            if (callback) callback();
          }, duration);
        };

        const getEyesLookAtCameraQuat = (angleDeg = 30) => {
          if (!eyesBone) return eyesBaseQuat;

          const camera = el.sceneEl.camera;
          if (!camera) return eyesBaseQuat;

          const cameraWorldPos = new THREE.Vector3();
          camera.getWorldPosition(cameraWorldPos);

          const eyesWorldPos = new THREE.Vector3();
          eyesBone.getWorldPosition(eyesWorldPos);

          const parentWorldQuat = new THREE.Quaternion();
          if (eyesBone.parent) {
            eyesBone.parent.getWorldQuaternion(parentWorldQuat);
          }

          const dirToCamera = new THREE.Vector3().subVectors(cameraWorldPos, eyesWorldPos).normalize();
          const localDir = dirToCamera.clone().applyQuaternion(parentWorldQuat.clone().invert());
          const fullLookAtQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), localDir);

          const angleRad = THREE.MathUtils.degToRad(angleDeg);
          const fullAngle = eyesBaseQuat.angleTo(fullLookAtQuat);
          const factor = fullAngle > 0 ? Math.min(angleRad / fullAngle, 1.0) : 0;

          return eyesBaseQuat.clone().slerp(fullLookAtQuat, factor);
        };

        const repeatMorphs = (count, maxMorphCount, onComplete) => {
          if (count >= maxMorphCount || isActionPlaying) {
            if (onComplete) onComplete();
            return;
          }
          animateMorphsTarget(otherMorphTargets, 0, 0.4, 150, () => {
            animateMorphsTarget(otherMorphTargets, 0.4, 0, 150, () => {
              repeatMorphs(count + 1, maxMorphCount, onComplete);
            });
          });
        };

        const scheduleNextIdleMorph = () => {
          clearTimeout(idleMorphTimer);
          const randomDelay = 10000 + Math.random() * 10000;

          idleMorphTimer = setTimeout(() => {
            if (!isActionPlaying) {
              const targetQuat = getEyesLookAtCameraQuat(30);
              rotateEyesTo(targetQuat, 300, () => {
                playRandomIdleSound();
                repeatMorphs(0, 5, () => {
                  rotateEyesTo(eyesBaseQuat, 300, () => {
                    scheduleNextIdleMorph();
                  });
                });
              });
            } else {
              scheduleNextIdleMorph();
            }
          }, randomDelay);
        };

        const scheduleNextHeadRotation = () => {
          clearTimeout(headTimer);
          if (!headBone) return;

          const randomDelay = 5000 + Math.random() * 5000;

          headTimer = setTimeout(() => {
            if (headBone) {
              const pitchDeg = 5 + Math.random() * 10;
              const yawDeg = (Math.random() - 0.5) * 40;
              const rollDeg = (Math.random() - 0.5) * 30;

              const pitch = THREE.MathUtils.degToRad(pitchDeg);
              const yaw = THREE.MathUtils.degToRad(yawDeg);
              const roll = THREE.MathUtils.degToRad(rollDeg);

              const offsetEuler = new THREE.Euler(pitch, yaw, roll, 'YXZ');
              const offsetQuat = new THREE.Quaternion().setFromEuler(offsetEuler);

              headStartQuat.copy(headBone.quaternion);
              headTargetQuat.copy(headBaseQuat).multiply(offsetQuat);

              headRotStartTime = performance.now();
              isHeadRotating = true;

              setTimeout(() => {
                scheduleNextHeadRotation();
              }, 1000 + 100);
            }
          }, randomDelay);
        };

        const playActionProcess = () => {
          console.log("action を再生");
          clearTimeout(idleMorphTimer);

          stopSound4Loop();

          if (actionCount < maxCount) {
            actionCount++;
            updateGauge();
          }

          startSound5Loop();
          boostSound5Volume();

          if (eyesBone) rotateEyesTo(eyesBaseQuat, 200);

          el.removeAttribute('animation__move');
          el.setAttribute('position', '0 0.02 -0.5');

          actions['idle'].stop();

          const speed = isFastTap ? 1.3 : 1.0;

          const actionClip = actions['action'];
          actionClip.timeScale = speed;

          actionClip.reset();
          actionClip.play();
          activeAction = actionClip;

          const soundFile = Math.random() < 0.5 ? 'sound.mp3' : 'sound2.mp3';
          playAmplifiedSound(soundFile, speed, 4.0);
          playAmplifiedSound('sound3.mp3', speed, 4.0);

          // 5%の確率で sound10.mp3 を再生 (sound2と同じく volumeBoost=4.0)
          if (Math.random() < 0.05) {
            playBufferSound(sound10Buffer, speed, 4.0);
          }

          if (actions2['idle2'] && actions2['action2']) {
            actions2['idle2'].stop();
            const actionClip2 = actions2['action2'];
            actionClip2.timeScale = speed;
            actionClip2.reset();
            actionClip2.play();
          }

          const targetIntensity = Math.random() < 0.5 ? 0.5 : 0.3;

          animateMorphs(0, targetIntensity, 300, () => {
            animateMorphs(targetIntensity, 0, 200);
          });
        };

        el.addEventListener('model-loaded', () => {
          const model = el.getObject3D('mesh');
          if (!model || !model.animations || model.animations.length === 0) return;

          const disabledBones = this.data.disabledBones.map(b => b.trim());
          model.animations.forEach((clip) => {
            clip.tracks = clip.tracks.filter((track) => {
              const isMatch = disabledBones.some(boneName => track.name.includes(boneName));
              return !isMatch;
            });
          });

          model.traverse((node) => {
            if (node.isBone) {
              if (node.name === '頭') {
                headBone = node;
                headBaseQuat.copy(node.quaternion);
                scheduleNextHeadRotation();
              }
              if (node.name === '両目') {
                eyesBone = node;
                eyesBaseQuat.copy(node.quaternion);
              }
            }
          });

          mixer = new THREE.AnimationMixer(model);

          model.animations.forEach((clip) => {
            actions[clip.name] = mixer.clipAction(clip);
          });

          if (actions['idle']) {
            activeAction = actions['idle'];
            activeAction.play();
            playSound4Loop();
            scheduleNextIdleMorph();
          }

          if (actions['action']) {
            actions['action'].setLoop(THREE.LoopOnce, 1);
            actions['action'].clampWhenFinished = true;
          }

          morphTargets = [];
          otherMorphTargets = [];
          const targetsToSearch = this.data.morphNames.map(name => name.trim());

          model.traverse((node) => {
            if (node.isMesh && node.morphTargetDictionary && node.morphTargetInfluences) {
              targetsToSearch.forEach((morphName) => {
                const index = node.morphTargetDictionary[morphName];
                if (index !== undefined) {
                  const item = { mesh: node, index: index, name: morphName };
                  morphTargets.push(item);
                  if (morphName !== 'まばたき') {
                    otherMorphTargets.push(item);
                  }
                }
              });
            }
          });

          mixer.addEventListener('finished', (e) => {
            if (e.action === actions['action'] && isActionPlaying) {
              if (hasQueuedAction) {
                hasQueuedAction = false;
                playActionProcess();
              } else {
                isActionPlaying = false;

                stopSound5Loop();

                el.removeAttribute('animation__move');
                el.setAttribute('animation__move', {
                  property: 'position',
                  to: '0 0 -0.5',
                  dur: 400,
                  easing: 'easeInOutQuad'
                });

                const actionClip = actions['action'];
                const idleClip = actions['idle'];

                actionClip.timeScale = 1.0;

                idleClip.reset();
                idleClip.play();

                playSound4Loop();

                actionClip.crossFadeTo(idleClip, 0.4, true);
                activeAction = idleClip;

                if (actions2['idle2'] && actions2['action2']) {
                  const actionClip2 = actions2['action2'];
                  const idleClip2 = actions2['idle2'];
                  actionClip2.timeScale = 1.0;
                  idleClip2.reset();
                  idleClip2.play();
                  actionClip2.crossFadeTo(idleClip2, 0.4, true);
                }

                scheduleNextIdleMorph();
              }
            }
          });
        });

        avatar2El = document.getElementById('avatar2');
        if (avatar2El) {
          avatar2El.addEventListener('model-loaded', () => {
            const model2 = avatar2El.getObject3D('mesh');
            if (!model2 || !model2.animations || model2.animations.length === 0) return;

            mixer2 = new THREE.AnimationMixer(model2);
            model2.animations.forEach((clip) => {
              actions2[clip.name] = mixer2.clipAction(clip);
            });

            if (actions2['idle2']) {
              actions2['idle2'].play();
            }

            if (actions2['action2']) {
              actions2['action2'].setLoop(THREE.LoopOnce, 1);
              actions2['action2'].clampWhenFinished = true;
            }
          });
        }

        this.tick = function (t, dt) {
          if (mixer) mixer.update(dt / 1000);
          if (mixer2) mixer2.update(dt / 1000);

          if (isHeadRotating && headBone) {
            const now = performance.now();
            const progress = Math.min((now - headRotStartTime) / 1000, 1);
            headBone.quaternion.slerpQuaternions(headStartQuat, headTargetQuat, progress);
            if (progress >= 1) isHeadRotating = false;
          }

          if (isEyesRotating && eyesBone) {
            const now = performance.now();
            const progress = Math.min((now - eyesRotStartTime) / eyesRotDuration, 1);
            eyesBone.quaternion.slerpQuaternions(eyesStartQuat, eyesTargetQuat, progress);
            if (progress >= 1) isEyesRotating = false;
          }
        };

        // 共通のアクショントリガー関数
        const triggerAction = () => {
          const now = performance.now();
          const interval = now - lastTapTime;

          if (lastTapTime > 0 && interval <= 400) {
            isFastTap = true;
          } else {
            isFastTap = false;
          }
          lastTapTime = now;

          if (actions['action'] && actions['idle']) {
            if (!isActionPlaying) {
              isActionPlaying = true;
              hasQueuedAction = false;
              playActionProcess();
            } else {
              hasQueuedAction = true;
              boostSound5Volume();
            }
          }
        };

        // 画面タップイベント
        window.addEventListener('click', () => {
          triggerAction();
        });

        // リモコン（キーボード/メディアキー扱い）のイベント
        window.addEventListener('keydown', (e) => {
          const triggerKeys = [
            'MediaTrackNext',
            'MediaPlayPause',
            'MediaSelect',
            'Enter',
            'Space',
            'a', 'A'
          ];

          if (triggerKeys.includes(e.key) || e.code === 'MediaTrackNext' || e.code === 'Space' || e.code === 'Enter') {
            e.preventDefault();
            triggerAction();
          }
        });

        // リモコン（ゲームパッド扱い）の入力チェック
        let lastGamepadButtonState = false;
        const checkGamepad = () => {
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (gp) {
              const isButtonPressed = gp.buttons.some((btn, idx) => (idx === 0 || idx === 1 || idx === 2) && btn.pressed);
              if (isButtonPressed && !lastGamepadButtonState) {
                triggerAction();
              }
              lastGamepadButtonState = isButtonPressed;
            }
          }
          requestAnimationFrame(checkGamepad);
        };
        requestAnimationFrame(checkGamepad);

      }
    });
  </script>
</head>
