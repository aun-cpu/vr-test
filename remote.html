<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リモコン (スマホA)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    #status {
      margin-bottom: 20px;
      font-size: 18px;
      color: #ff80ab;
    }
    #btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #e91e63, #ff80ab);
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(233, 30, 99, 0.5);
      cursor: pointer;
    }
    #btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="status">接続中...</div>
  <button id="btn" disabled>ACTION</button>

  <script>
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btn');

    // PeerJSの初期化（ランダムなIDで作成）
    const peer = new Peer();
    let conn = null;

    peer.on('open', (id) => {
      statusEl.innerText = "スマホBに接続を試みています...";
      // 固定ID「my-avatar-3d-target」を持つスマホBに接続
      conn = peer.connect('my-avatar-3d-target');

      conn.on('open', () => {
        statusEl.innerText = "接続成功！タップで操作できます";
        statusEl.style.color = "#4caf50";
        btn.disabled = false;
      });

      conn.on('close', () => {
        statusEl.innerText = "切断されました。再読み込みしてください。";
        statusEl.style.color = "#f44336";
        btn.disabled = true;
      });
    });

    peer.on('error', (err) => {
      console.error(err);
      statusEl.innerText = "接続エラー: スマホB(index.html)を先に開いてください";
    });

    function sendTap() {
      if (conn && conn.open) {
        conn.send('tap');
      }
    }

    btn.addEventListener('click', sendTap);
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') sendTap();
    });
  </script>
</body>
</html>
